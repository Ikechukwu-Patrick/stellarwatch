[project]
name = "pulseforge"
version = "0.1.0"
description = "Open-source API health monitoring platform built with FastAPI."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "B008",
]